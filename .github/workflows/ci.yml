name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Keep the containment test deterministic (jailed, non-root process).
      SANDBOX_DISABLE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile all Python sources
        run: python -m compileall -q .

      - name: Run smoke tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker build + container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: leado:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and verify HTTP + auth
        run: |
          set -euo pipefail
          TOKEN="ci-test-token-0123456789abcdef"
          docker run -d --name leado-ci -p 8080:8000 \
            -e SOFTORASYSTEMS_TOKEN="$TOKEN" \
            -e SOFTORA_HOST=0.0.0.0 \
            leado:ci

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo "UI status: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)"
          echo "Unauthenticated API status: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/stats)"
          echo "Authenticated API status: $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/stats)"

          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/stats)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/stats)" = "200"

      - name: Container logs
        if: always()
        run: docker logs leado-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f leado-ci || true
