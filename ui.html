<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dealwright | AI Quote-to-Cash on PayPal</title>
  <style>
    :root {
      --bg: #070b14;
      --p: #0c1120;
      --p2: #12182c;
      --b: #1b2542;
      --t: #edf2fc;
      --m: #8896b8;
      --blue: #3b82f6;
      --pur: #8b5cf6;
      --ok: #10b981;
      --warn: #f59e0b;
      --bad: #ef4444;
      --accent: #6366f1
    }

    [hidden] {
      display: none !important
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--t);
      font: 13px/1.48 Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      min-height: 100vh
    }

    a {
      color: #8aa4ff;
      text-decoration: none
    }

    a:hover {
      text-decoration: underline
    }

    .m {
      color: var(--m);
      font-size: 12px
    }

    .side {
      width: 220px;
      background: var(--p);
      border-right: 1px solid var(--b);
      padding: 18px 12px;
      position: sticky;
      top: 0;
      height: 100vh;
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .logo {
      font-weight: 750;
      font-size: 15px;
      padding: 6px 10px 18px;
      display: flex;
      gap: 10px;
      align-items: center;
      letter-spacing: -.02em
    }

    .logo i {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--blue), var(--pur));
      box-shadow: 0 0 12px rgba(99, 102, 241, .4)
    }

    .nav-section {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #5a688a;
      padding: 12px 10px 4px;
      margin-top: 6px
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 7px;
      background: none;
      border: 0;
      color: var(--m);
      font: inherit;
      cursor: pointer;
      text-align: left;
      transition: all .15s
    }

    .nav:hover {
      background: var(--p2);
      color: var(--t)
    }

    .nav.on {
      background: #182346;
      color: #93c5fd;
      font-weight: 600
    }

    svg.ic {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none
    }

    .main {
      flex: 1;
      min-width: 0;
      padding: 22px 28px;
      overflow-y: auto
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px
    }

    h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 700;
      letter-spacing: -.02em
    }

    .badge-vultr {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0d233a;
      border: 1px solid #1e3a5f;
      color: #60a5fa;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px
    }

    .badge-vultr i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 18px
    }

    .card {
      background: var(--p);
      border: 1px solid var(--b);
      border-radius: 9px;
      padding: 12px 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .25)
    }

    .card b {
      display: block;
      font-size: 20px;
      font-weight: 700;
      margin-top: 3px;
      letter-spacing: -.02em
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
      color: var(--t);
      background: var(--p);
      border: 1px solid var(--b);
      border-radius: 7px;
      padding: 7px 11px
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, .2)
    }

    textarea {
      width: 100%;
      resize: vertical
    }

    button {
      cursor: pointer;
      display: inline-flex;
      gap: 7px;
      align-items: center;
      font-weight: 550;
      transition: background .15s, border-color .15s
    }

    button:hover {
      border-color: #384b7a;
      background: var(--p2)
    }

    .pri {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff
    }

    .pri:hover {
      background: #2563eb;
      border-color: #2563eb
    }

    .accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff
    }

    .accent:hover {
      background: #4f46e5
    }

    .dan {
      color: var(--bad)
    }

    .dan:hover {
      border-color: var(--bad)
    }

    details.card > summary { list-style: none; cursor: pointer; display: block }
    details.card > summary::-webkit-details-marker { display: none }
    details.card[open] > summary { margin-bottom: 4px }
    #paygrid button { padding: 4px 10px; font-size: 12px; line-height: 1.2; margin: 0 2px 0 0; min-height: 0; vertical-align: middle }
    #paygrid .bd { padding: 2px 9px; line-height: 1.5; display: inline-block; vertical-align: middle }
    #paygrid .ag-cell { display: flex; align-items: center }
    .chat-msg code { background: rgba(148,163,184,.15); padding: 1px 5px; border-radius: 4px; font-size: 12px }
    .tw {
      overflow-x: auto;
      border: 1px solid var(--b);
      border-radius: 9px;
      background: var(--p);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .2)
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th {
      font-weight: 600;
      color: var(--m);
      text-align: left;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: 10px 12px;
      border-bottom: 1px solid var(--b);
      white-space: nowrap
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #141b30;
      vertical-align: top
    }

    tbody tr {
      cursor: pointer;
      transition: background .1s
    }

    tbody tr:hover {
      background: var(--p2)
    }

    tr:last-child td {
      border-bottom: 0
    }

    .opp {
      max-width: 260px;
      color: #cbd5e1;
      font-size: 12.5px
    }

    .sc {
      display: inline-block;
      min-width: 34px;
      text-align: center;
      border-radius: 6px;
      padding: 2px 7px;
      font-weight: 700;
      font-size: 11.5px
    }

    .s4 {
      background: #064e3b;
      color: var(--ok)
    }

    .s3 {
      background: #1e3a8a;
      color: #93c5fd
    }

    .s2 {
      background: #3b1d5c;
      color: #c084fc
    }

    .s1 {
      background: #451a03;
      color: var(--warn)
    }

    .s0 {
      background: #1f2937;
      color: var(--m)
    }

    .bd {
      display: inline-block;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap
    }

    .ga {
      background: #1e293b;
      color: #94a3b8
    }

    .gb {
      background: #1e3a8a;
      color: #93c5fd
    }

    .gc {
      background: #3b1d5c;
      color: #c084fc
    }

    .gd {
      background: #451a03;
      color: var(--warn)
    }

    .ge {
      background: #064e3b;
      color: var(--ok)
    }

    .gf {
      background: #4c0519;
      color: var(--bad)
    }

    .pg {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px
    }

    .board {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
      align-items: flex-start
    }

    .col {
      flex: 0 0 240px;
      background: var(--p);
      border: 1px solid var(--b);
      border-radius: 9px;
      padding: 10px;
      min-height: 140px
    }

    .col.over {
      border-color: var(--blue);
      background: #131c36
    }

    .col h4 {
      margin: 2px 4px 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--m);
      display: flex;
      justify-content: space-between;
      letter-spacing: .05em;
      text-transform: uppercase
    }

    .kc {
      background: var(--p2);
      border: 1px solid var(--b);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      cursor: grab;
      transition: all .15s
    }

    .kc:hover {
      border-color: #3b82f6;
      transform: translateY(-1px)
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(660px, 100%);
      background: var(--p);
      border-left: 1px solid var(--b);
      overflow-y: auto;
      padding: 22px 24px;
      box-shadow: -20px 0 50px rgba(0, 0, 0, .7);
      z-index: 50
    }

    .drawer h3 {
      margin: 20px 0 10px;
      font-size: 12px;
      color: var(--m);
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 700
    }

    .kv {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 6px 12px;
      font-size: 12.5px
    }

    .kv span:nth-child(odd) {
      color: var(--m)
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .grid2 label {
      display: block;
      color: var(--m);
      font-size: 11px;
      margin-bottom: 2px
    }

    .grid2 input,
    .grid2 select {
      width: 100%
    }

    .ec {
      border: 1px solid var(--b);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      background: var(--p2)
    }

    .eh {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap
    }

    .ec input.es {
      width: 100%;
      margin-bottom: 8px
    }

    .pv {
      white-space: pre-wrap;
      background: #060a14;
      border: 1px dashed var(--b);
      border-radius: 7px;
      padding: 12px;
      margin-bottom: 8px;
      font-family: monospace;
      font-size: 12px
    }

    .bt {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 8px
    }

    .tl {
      border-left: 1px solid var(--b);
      padding-left: 14px
    }

    .tl div {
      margin-bottom: 10px;
      position: relative
    }

    .tl div:before {
      content: "";
      position: absolute;
      left: -18px;
      top: 6px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent)
    }

    .empty {
      text-align: center;
      padding: 54px 20px;
      border: 1px dashed var(--b);
      border-radius: 10px;
      color: var(--m)
    }

    .empty b {
      display: block;
      color: var(--t);
      font-size: 16px;
      margin: 10px 0 6px
    }

    .skel {
      height: 36px;
      border-radius: 7px;
      margin: 8px 0;
      background: linear-gradient(90deg, var(--p) 25%, var(--p2) 50%, var(--p) 75%);
      background-size: 200% 100%;
      animation: sk 1.2s infinite
    }

    @keyframes sk {
      to {
        background-position: -200% 0
      }
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .t {
      background: var(--p2);
      border: 1px solid var(--b);
      border-left: 4px solid var(--ok);
      padding: 10px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .5);
      font-weight: 500
    }

    .t.e {
      border-left-color: var(--bad)
    }

    .login {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: grid;
      place-items: center;
      z-index: 200
    }

    .login form {
      background: var(--p);
      border: 1px solid var(--b);
      border-radius: 12px;
      padding: 28px;
      width: 340px;
      display: grid;
      gap: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .6)
    }

    .proposal-box {
      border: 1px solid var(--b);
      background: var(--p2);
      border-radius: 10px;
      padding: 16px;
      margin-top: 12px
    }

    .pricing-tier {
      border: 1px solid var(--b);
      border-radius: 8px;
      padding: 12px;
      background: var(--p);
      margin-top: 8px
    }

    .chat-window {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
      border: 1px solid var(--b);
      border-radius: 10px;
      background: var(--p);
      overflow: hidden
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .chat-msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5
    }

    .chat-msg.user {
      align-self: flex-end;
      background: #1e3a8a;
      color: #eff6ff
    }

    .chat-msg.bot {
      align-self: flex-start;
      background: var(--p2);
      border: 1px solid var(--b);
      color: var(--t)
    }

    .chat-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px
    }

    .chat-input-bar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--b);
      background: var(--p2)
    }

    .chat-input-bar input {
      flex: 1
    }

    body.voice-mode .main {
      padding: 14px 18px 16px;
      background: #07101c
    }

    body.voice-mode #stats,
    body.voice-mode #bar,
    body.voice-mode #pager {
      display: none
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0
    }

    .voice-stage {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(340px, .86fr);
      gap: 8px 20px;
      height: calc(100vh - 108px);
      min-height: 640px;
      background:
        radial-gradient(ellipse at 32% 48%, rgba(56, 120, 220, .18), transparent 52%),
        linear-gradient(180deg, rgba(14, 24, 48, .35), transparent 28%),
        repeating-linear-gradient(0deg, transparent, transparent 47px, rgba(120, 160, 210, .06) 48px),
        repeating-linear-gradient(90deg, transparent, transparent 47px, rgba(120, 160, 210, .06) 48px);
      border: 1px solid #1a2744;
      border-radius: 16px;
      padding: 12px 16px 12px;
      position: relative
    }

    .orb-col,
    .rail-col {
      min-width: 0;
      min-height: 0
    }

    .orb-col {
      display: flex;
      flex-direction: column
    }

    .rail-col {
      display: flex;
      flex-direction: column;
      padding-top: 4px
    }

    .orb-wrap {
      position: relative;
      flex: 1;
      min-height: 480px
    }

    .orb-wrap canvas {
      width: 100%;
      height: 100%;
      display: block
    }

    .avatar {
      position: absolute;
      left: 4%;
      top: 6%;
      width: 74px;
      height: 74px;
      border-radius: 22px;
      background: #f4f7fb;
      display: grid;
      place-items: center
    }

    .avatar svg {
      width: 54px;
      height: 54px
    }

    .talk-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 8px 0;
      min-height: 48px
    }

    .talk-bar input {
      flex: 1;
      background: transparent;
      border: 0;
      border-bottom: 1px solid #314666;
      border-radius: 0;
      font-size: 16px;
      padding: 10px 4px;
      min-height: 44px
    }

    .talk-bar input:focus {
      box-shadow: none;
      border-color: #7dd3fc
    }

    .talk-go {
      background: transparent;
      border: 0;
      color: #e8f2ff;
      font-weight: 650;
      letter-spacing: .01em;
      min-height: 44px;
      padding: 8px 10px
    }

    .talk-go.live {
      color: #67e8f9
    }

    .shimmer-name {
      color: #d5e2f4;
      font-weight: 650;
      letter-spacing: .04em
    }

    .transcript {
      margin-top: 8px;
      background: rgba(8, 14, 28, .78);
      border: 1px solid #243656;
      border-radius: 12px;
      padding: 12px 14px;
      max-height: 132px;
      overflow: auto
    }

    .transcript .who {
      color: #7dd3fc;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase
    }

    .transcript p {
      margin: 4px 0 0
    }

    .rail-head {
      display: grid;
      gap: 10px;
      margin: 8px 8px 12px
    }

    .rail-metric {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 10px;
      align-items: center;
      font-size: 13px;
      color: #d5e2f4
    }

    .rail-metric b {
      color: #b9f3ff;
      font-weight: 650
    }

    .rail-metric .track {
      grid-column: 1 / -1;
      height: 4px;
      background: #17233c;
      border-radius: 4px;
      overflow: hidden
    }

    .rail-metric .track i {
      display: block;
      height: 100%;
      background: #38bdf8
    }

    .vio-core {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      padding: 2px 8px 4px;
      color: #c5d4ff;
      font-size: 11px;
      letter-spacing: .12em
    }

    .vio-core b {
      color: #f4f7ff;
      font-size: 13px;
      letter-spacing: .16em
    }

    .rail-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-right: 2px
    }

    .rail-label {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #c5d2ea;
      padding: 10px 12px 4px
    }

    .agent-rail {
      position: relative;
      margin: 0 8px 0 12px;
      padding: 0 0 0 16px
    }

    .agent-rail:before {
      content: "";
      position: absolute;
      left: 5px;
      top: 8px;
      bottom: 8px;
      width: 1px;
      background: #24508a
    }

    .agent-rail.flip {
      margin: 0 8px 0 0;
      padding: 0 20px 0 4px
    }

    .agent-rail.flip:before {
      left: auto;
      right: 13px
    }

    .rail-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: none;
      border: 0;
      color: #e7eefc;
      padding: 0 10px;
      min-height: 44px;
      text-align: left;
      border-radius: 8px
    }

    .agent-rail.flip .rail-item {
      text-align: right
    }

    .agent-rail.flip .rail-item span {
      flex: 1
    }

    .agent-rail:not(.flip) .node {
      order: -1
    }

    .transcript .chat-actions button {
      min-height: 44px
    }

    .rail-item:hover {
      background: rgba(30, 58, 110, .45)
    }

    .rail-item.on {
      background: rgba(37, 99, 235, .38);
      color: #fff
    }

    .rail-item .node {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #7dd3fc;
      flex: none
    }

    .agent-rail.flip .rail-item .node {
      background: #d8b4fe
    }

    .rail-item.on .node {
      background: #fff
    }

    .rail-dock {
      flex: none;
      padding-top: 8px;
      border-top: 1px solid #1b2c4d
    }

    .intent-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #d5e0f4;
      font-size: 12px;
      letter-spacing: .12em
    }

    .intent-bar b {
      color: #fff
    }

    .intent-bar button,
    .conn-panel button {
      min-height: 44px;
      letter-spacing: .08em
    }

    .conn-dock {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px
    }

    .conn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #314666;
      background: #0c1628;
      color: #e7eefc;
      border-radius: 999px;
      padding: 0 12px;
      min-height: 44px;
      font-size: 12px
    }

    .conn .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      flex: none
    }

    .conn.on .dot {
      background: #34d399
    }

    .conn.off {
      color: #b7c6de;
      border-style: dashed
    }

    .conn-panel {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .conn-panel input {
      flex: 1;
      min-height: 44px
    }

    .voice-stage :focus-visible {
      outline: 2px solid #7dd3fc;
      outline-offset: 2px
    }

    .voice-stage.speaking .avatar {
      outline: 2px solid #7dd3fc
    }

    @media (prefers-reduced-motion: reduce) {
      .voice-stage.speaking .avatar {
        outline: 2px solid #7dd3fc
      }
    }

    @media(max-width:1100px) {
      .cards {
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr))
      }
    }

    @media(max-width:860px) {
      .voice-stage {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 0
      }

      .rail-scroll {
        max-height: 420px
      }

      .orb-wrap {
        min-height: 360px
      }
    }

    @media(max-width:800px) {
      body {
        flex-direction: column
      }

      .side {
        width: 100%;
        height: auto;
        position: static;
        display: flex;
        gap: 6px;
        padding: 8px
      }

      .main {
        padding: 14px
      }

      .nav {
        min-height: 44px
      }
    }
  </style>
</head>

      style="padding:10px;font-size:11px;line-height:1.4;background:var(--p2);border-radius:6px;margin-top:6px"></div>
  </aside>

  <div class="main">
    <div class="header">
      <h1 id="title">Pipeline</h1>
      <div class="badge-vultr"><i></i><span>PayPal Sandbox · AI Agent</span></div>
    </div>
    <div class="cards" id="stats"></div>
    <div class="bar" id="bar"></div>
    <div id="content"></div>
    <div class="pg" id="pager"></div>
  </div>

  <div id="drawer" class="drawer" hidden></div>
  <div id="toast"></div>
  <div id="login" class="login" hidden>
    <form id="lf">
      <div class="logo" style="padding:0"><i></i><b>Dealwright × PayPal</b></div>
      <span class="m">Enter access token</span>
      <input id="tok" type="password" value="" placeholder="Access token" autocomplete="current-password" required>
      <button class="pri">Launch Platform</button>
    </form>
  </div>

  <script>
    addEventListener('unhandledrejection', e => {
      if (/message channel closed before a response was received/i.test(e.reason?.message || '')) e.preventDefault();
    });
    const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const ST = ["NEW", "RESEARCHED", "QUALIFIED", "EMAIL_DRAFTED", "APPROVED", "CONTACTED", "FOLLOW_UP", "REPLIED", "MEETING", "PROPOSAL", "WON", "LOST", "OPTED_OUT"];
    const GRP = { NEW: 'a', RESEARCHED: 'a', QUALIFIED: 'a', EMAIL_DRAFTED: 'b', APPROVED: 'b', CONTACTED: 'c', FOLLOW_UP: 'c', REPLIED: 'c', MEETING: 'd', PROPOSAL: 'd', WON: 'e', LOST: 'f', OPTED_OUT: 'f', draft: 'a', approved: 'b', sent: 'e', rejected: 'f', paid: 'e', invoiced: 'd' };
    const band = n => n >= 90 ? 's4' : n >= 75 ? 's3' : n >= 60 ? 's2' : n >= 40 ? 's1' : 's0', badge = s => `<span class="bd g${GRP[s] || 'a'}">${esc(String(s).replace('_', ' '))}</span>`, pill = n => `<span class="sc ${band(n)}">${n}</span>`;
    const money = n => '$' + Number(n || 0).toLocaleString(), nice = s => esc((s || '—').replace(/_/g, ' '));
    const CARDS = [['Total Leads', 'discovered'], ['Qualified (60+)', 'qualified'], ['High Priority (75+)', 'high'], ['Drafts Awaiting Approval', 'ready'], ['Emails Sent', 'sent'], ['Positive Replies', 'positive'], ['Meetings Booked', 'meetings'], ['Won Deals', 'won'], ['Closed MRR', 'mrr', 1], ['Weighted Pipeline Value', 'pipeline_mrr', 1]];
    const LF_CARDS = [['Requests today', 'requests'], ['Leads found today', 'leads_found'], ['Leads imported today', 'leads_imported'], ['Total requests', 'total_requests'], ['Total leads found', 'total_leads'], ['Total imported', 'total_imported'], ['Monitoring active', 'monitoring']];
    const BULK_CARDS = [['Today requests', 'requests'], ['Today limit', 'limit'], ['Total requests', 'total_requests'], ['Total jobs', 'total_jobs'], ['Completed jobs', 'completed_jobs'], ['Running jobs', 'running_jobs'], ['Failed jobs', 'failed_jobs']];

    let T = sessionStorage.getItem('t') || '', V = 'table', F = { q: '', country: '', industry: '', service: '', status: '', min: '', since: '', sort: 'score', page: 1 }, FAC = { country: [], industry: [], service: [] }, OPEN = null;

    async function api(p, o = {}) {
      const r = await fetch(p, { ...o, headers: { Authorization: 'Bearer ' + T, 'Content-Type': 'application/json' }, body: o.body ? JSON.stringify(o.body) : undefined });
      if (r.status === 401) { login(); throw new Error('Not signed in') }
      const d = (r.headers.get('content-type') || '').includes('json') ? await r.json() : await r.blob();
      if (!r.ok) throw new Error(d.error || r.statusText);
      return d;
    }

    function toast(m, e) { const d = document.createElement('div'); d.className = 't' + (e ? ' e' : ''); d.textContent = m; $('#toast').append(d); setTimeout(() => d.remove(), e ? 6000 : 3000) }
    function login() { $('#login').hidden = false }
    $('#lf').onsubmit = e => { e.preventDefault(); T = $('#tok').value; sessionStorage.setItem('t', T); $('#login').hidden = true; boot() };
    const qs = x => new URLSearchParams(Object.entries({ ...F, ...x }).filter(([, v]) => v !== '' && v != null)).toString();
    const opts = (a, sel, all) => `<option value="">${all}</option>` + a.map(v => `<option ${v === sel ? 'selected' : ''} value="${esc(v)}">${nice(v)}</option>`).join('');

    function bar() {
      if (['approvals', 'lead_finder', 'proposals', 'payments', 'ops', 'sandbox', 'copilot', 'voice', 'growth'].includes(V)) { $('#bar').innerHTML = ''; return }
      $('#bar').innerHTML = `<input id="q" placeholder="Search company, domain, contact" value="${esc(F.q)}" style="width:230px">
  <select data-f="country">${opts(FAC.country, F.country, 'All countries')}</select><select data-f="industry">${opts(FAC.industry, F.industry, 'All industries')}</select>
  <select data-f="service">${opts(FAC.service, F.service, 'All services')}</select><select data-f="status">${opts(ST, F.status, 'All statuses')}</select>
  <input data-f="min" type="number" min="0" max="100" placeholder="Min score" value="${esc(F.min)}" style="width:104px"><input data-f="since" type="date" value="${esc(F.since)}" title="Discovered since">
  <select data-f="sort"><option value="score">Top score</option><option value="newest" ${F.sort === 'newest' ? 'selected' : ''}>Newest</option><option value="name" ${F.sort === 'name' ? 'selected' : ''}>Company A–Z</option></select>
  <button class="accent" data-act="adddomains">+ Add Domains</button><button data-act="batch">AI Research Next 5</button><button data-act="export"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M4 20h16"/></svg>Export CSV</button>`;
    }

    const empty = (t, s) => `<div class="empty"><svg class="ic" style="width:32px;height:32px;margin-bottom:8px" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><b>${t}</b>${s}</div>`;
    const skel = () => '<div class="skel"></div>'.repeat(6);

    async function aiStatus() {
      try {
        const a = await api('/api/ai/status');
        $('#ai').innerHTML = a.configured ? `<b>${esc(a.provider)}</b><br><span style="color:#60a5fa">${esc(a.model)}</span><br>${a.calls_today}/${a.cap} inference calls today` : 'AI not configured';
      } catch (e) { }
    }

    async function stats() {
      aiStatus();
      try {
        const s = await api('/api/stats');
        $('#stats').innerHTML = CARDS.map(([l, k, m]) => `<div class="card"><span class="m">${l}</span><b>${m ? money(s[k]) : s[k]}</b></div>`).join('');
      } catch (e) { }
    }

    async function refresh() {
      if (V === 'lead_finder') { LFRefresh(); return }
      if (V === 'bulk') { bulkRefresh(); return }
      if (V === 'proposals') { proposalsRefresh(); return }
      if (V === 'payments') { paymentsRefresh(); return }
      if (V === 'ops') { opsRefresh(); return }
      if (V === 'sandbox') { sandboxRefresh(); return }
      if (V === 'copilot') { copilotRefresh(); return }
      if (V === 'voice') { voiceRefresh(); return }
      if (V === 'growth') { growthRefresh(); return }

      stats(); bar(); $('#pager').innerHTML = '';
      $('#title').textContent = { table: 'Pipeline Leads', board: 'Visual Pipeline Board', approvals: 'Email Review & Approvals' }[V] || 'Pipeline';
      $('#content').innerHTML = skel();

      try {
        if (V === 'approvals') return approvals();
        const d = await api('/api/leads?' + qs(V === 'board' ? { size: 200, page: 1 } : { size: 25 }));
        if (!d.items.length) { $('#content').innerHTML = empty('No leads found', 'Add domains or run discovery to populate leads.'); return }
        $('#content').innerHTML = V === 'board' ? board(d) : table(d);
        if (V === 'table') pager(d);
      } catch (e) {
        $('#content').innerHTML = empty('Could not load leads', esc(e.message) + '<br><button data-act="retry" style="margin-top:10px">Retry</button>');
      }
    }

    // ---- PROPOSALS VIEW ----
    const PST = { created: 'gd', sent: 'gd', completed: 'ge', active: 'ge', paid: 'ge', refunded: 'gc', cancelled: 'gf', failed: 'gf' };
    const VA = [];
    // Minimal, safe markdown for copilot replies: escape first, then **bold**, _italic_, `code`, newlines.
    const md = t => esc(String(t || '')).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|\s)_(.+?)_(?=\s|$)/g, '$1<i>$2</i>')
      .replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*([^*\n]+)\*/g, '<i>$1</i>').replace(/\n/g, '<br>');
    // ---- AG Grid Community ledger (falls back to the plain table if the CDN is unreachable) ----
    let AGP = null;
    function loadAgGrid() {
      if (window.agGrid) return Promise.resolve(true);
      if (!AGP) AGP = new Promise(res => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/ag-grid-community@33.0.0/dist/ag-grid-community.min.js';
        s.onload = () => res(!!window.agGrid); s.onerror = () => { AGP = null; res(false) };
        setTimeout(() => res(!!window.agGrid), 4000);
        document.head.append(s);
      });
      return AGP;
    }
    function payActions(p) {
      const open = ['created', 'sent'].includes(p.status), done = ['completed', 'paid', 'active'].includes(p.status);
      return `<button data-act="pay_sync" data-id="${p.id}">Sync</button>` +
        (open ? ` <button class="accent" data-act="pay_remind" data-id="${p.id}">AI reminder</button>` : '') +
        (done ? ` <button data-act="pay_refund" data-id="${p.id}" data-kind="${esc(p.kind)}" data-amt="${p.amount}" data-co="${esc(p.company)}">${p.kind === 'subscription' ? 'Cancel' : 'Refund'}</button>` : '');
    }
    function renderPayGrid(items) {
      const el = $('#paygrid'); if (!el) return;
      const theme = agGrid.themeQuartz.withPart(agGrid.colorSchemeDarkBlue).withParams({ backgroundColor: '#0d1324', headerBackgroundColor: '#12182c', borderColor: '#1b2542', fontSize: 13 });
      agGrid.createGrid(el, {
        theme, rowData: items, rowHeight: 44, animateRows: true, pagination: items.length > 15, paginationPageSize: 15,
        defaultColDef: { sortable: true, filter: true, resizable: true, floatingFilter: true },
        columnDefs: [
          { field: 'company', headerName: 'Company', flex: 1.4, minWidth: 165, tooltipField: 'company', cellRenderer: x => `<b>${esc(x.value)}</b>` },
          { field: 'tier_name', headerName: 'Item', flex: 1.2, minWidth: 140, tooltipField: 'tier_name', valueFormatter: x => (x.value || '').replace(' (Recommended)', '') },
          { field: 'kind', headerName: 'Type', width: 110 },
          { field: 'amount', headerName: 'Amount', width: 115, filter: 'agNumberColumnFilter', valueFormatter: x => money(x.value) + (x.data.interval === 'month' ? '/mo' : '') },
          { field: 'status', headerName: 'Status', width: 115, cellRenderer: x => `<span class="bd ${PST[x.value] || 'ga'}">${esc(x.value)}</span>` },
          { field: 'age_days', headerName: 'Age (d)', width: 95, filter: 'agNumberColumnFilter', cellStyle: x => (['created', 'sent'].includes(x.data.status) && x.value > 7) ? { color: '#fbbf24', fontWeight: 700 } : null },
          { field: 'paypal_id', headerName: 'PayPal ID', width: 170, tooltipField: 'paypal_id', cellStyle: { fontFamily: 'monospace', fontSize: '12px' } },
          { headerName: 'Actions', width: 190, sortable: false, filter: false, floatingFilter: false, cellRenderer: x => payActions(x.data) }
        ]
      });
    }
    async function paymentsRefresh() {
      stats(); $('#bar').innerHTML = ''; $('#pager').innerHTML = ''; $('#title').textContent = 'PayPal Payments'; $('#content').innerHTML = skel();
      try {
        const [d, st] = await Promise.all([api('/api/payments'), api('/api/paypal/status')]);
        const s = d.summary;
        const head = `<div class="proposal-box" style="margin-bottom:14px">
          <b style="color:#93c5fd">💳 PayPal ${esc(st.env)} · ${st.configured ? 'connected' : 'not connected: set PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET'}</b>
          <div class="m" style="margin-top:4px">${st.apis.map(esc).join(' · ')} · webhook verification ${st.webhook_verification ? 'on' : 'off (return-URL capture still works)'}</div>
          <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:10px">
            <div><span class="m">Collected</span><br><b style="color:#34d399;font-size:18px">${money(s.collected)}</b></div>
            <div><span class="m">PayPal MRR</span><br><b style="color:#34d399;font-size:18px">${money(s.mrr)}/mo</b></div>
            <div><span class="m">Outstanding</span><br><b style="color:#fbbf24;font-size:18px">${money(s.outstanding_total)}</b></div>
            <div><span class="m">Refunded</span><br><b style="font-size:18px">${money(s.refunded)}</b></div>
          </div></div>`;
        if (!d.items.length) {
          $('#content').innerHTML = head + empty('No PayPal payments yet', 'Open a proposal and click "PayPal checkout link", or ask Wren to "invoice &lt;company&gt;".');
          return;
        }
        if (await loadAgGrid()) { $('#content').innerHTML = head + '<div id="paygrid" style="height:520px"></div>'; renderPayGrid(d.items); return }
        $('#content').innerHTML = head + `<div class="tw"><table><thead><tr><th>Company<th>Item<th>Type<th>Amount<th>Status<th>PayPal ID<th>Age<th>Actions</tr></thead><tbody>` +
          d.items.map(p => `<tr>
            <td><b>${esc(p.company)}</b><div class="m">${esc(p.payer_email || p.contact_email || '')}</div></td>
            <td>${esc(p.tier_name || '')}</td>
            <td>${esc(p.kind)}</td>
            <td><b>${money(p.amount)}${p.interval === 'month' ? '/mo' : ''}</b></td>
            <td><span class="bd ${PST[p.status] || 'ga'}">${esc(p.status)}</span></td>
            <td class="m" style="font-family:monospace">${esc(p.paypal_id || '')}</td>
            <td>${p.age_days}d</td>
            <td style="white-space:nowrap">
              <button data-act="pay_sync" data-id="${p.id}">Sync</button>
              ${['created', 'sent'].includes(p.status) ? `<button class="accent" data-act="pay_remind" data-id="${p.id}">AI reminder</button>` : ''}
              ${['completed', 'paid', 'active'].includes(p.status) ? `<button data-act="pay_refund" data-id="${p.id}" data-kind="${esc(p.kind)}" data-amt="${p.amount}" data-co="${esc(p.company)}">${p.kind === 'subscription' ? 'Cancel' : 'Refund'}</button>` : ''}
              ${p.approve_url && ['created', 'sent'].includes(p.status) ? `<a href="${esc(p.approve_url)}" target="_blank" rel="noopener noreferrer">Open</a>` : ''}
            </td></tr>`).join('') + `</tbody></table></div>`;
      } catch (e) {
        $('#content').innerHTML = empty('Could not load payments', esc(e.message));
      }
    }

    // ---- Team & Projects (admin) ----
    const AV = { free: ['ge', 'Free'], busy: ['gb', 'Busy'], at_capacity: ['gd', 'At capacity'], away: ['ga', 'Away'], inactive: ['gf', 'Inactive'] };
    const PRI = { urgent: 'gf', high: 'gd', normal: 'gb', low: 'ga' };
    const PCOLS = [['queued', 'Queued'], ['in_progress', 'In progress'], ['review', 'Review'], ['done', 'Done']];
    const NEXT = { queued: [['in_progress', 'Start ▶']], in_progress: [['review', 'Send to review'], ['queued', '↩ Queue']], review: [['done', 'Mark done ✓'], ['in_progress', '↩ Rework']], done: [], on_hold: [['queued', 'Resume']] };
    let OPS = { team: [], projects: [] };
    async function opsRefresh() {
      $('#bar').innerHTML = ''; $('#pager').innerHTML = ''; $('#title').textContent = 'Team & Projects'; $('#content').innerHTML = skel();
      try {
        const [t, p] = await Promise.all([api('/api/team'), api('/api/projects')]);
        OPS = { team: t.items, projects: p.items }; const s = p.summary;
        $('#stats').innerHTML = [['Free', s.free], ['Busy', s.busy], ['At capacity', s.at_capacity], ['Away', s.away],
          ['Queued', `${s.queued}<span class="m" style="font-size:12px"> · ${s.unassigned_queued} unassigned</span>`],
          ['In progress', s.in_progress], ['In review', s.review], ['Overdue', s.overdue], ['People', s.humans], ['AI agents', s.ai_agents]]
          .map(([l, v]) => `<div class="card"><span class="m">${l}</span><b>${v}</b></div>`).join('');
        const opts = sel => `<option value="">Unassigned</option>` + OPS.team.map(m => `<option value="${m.id}" ${m.id === sel ? 'selected' : ''}>${esc(m.name)}${m.kind === 'ai_agent' ? ' 🤖' : ''} · ${esc(AV[m.availability][1])}</option>`).join('');
        const card = p => `<div class="kc" style="cursor:default">

    function mountOrb(canvas) {
      const ctx = canvas.getContext('2d');
      const N = 520, pts = [], golden = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < N; i++) {
        const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(Math.max(0, 1 - y * y)), th = golden * i;
        pts.push([Math.cos(th) * r, y, Math.sin(th) * r]);
      }
      let raf = 0, t = 0, live = true;
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function frame() {
        if (!live) return;
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.width = canvas.clientWidth * dpr, h = canvas.height = canvas.clientHeight * dpr;
        ctx.clearRect(0, 0, w, h);
        t += 0.006;
        const cx = w * 0.46, cy = h * 0.50, R = Math.min(w, h) * 0.30;
        ctx.strokeStyle = 'rgba(139,92,246,.45)';
        ctx.lineWidth = 1.4 * dpr;
        ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.35, R * 0.46, -0.55 + Math.sin(t) * 0.05, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(56,189,248,.25)';
        ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.15, R * 1.15, 0, t, t + 1.4); ctx.stroke();
        const glow = ctx.createRadialGradient(cx, cy, R * 0.1, cx, cy, R * 0.55);
        glow.addColorStop(0, 'rgba(186,230,253,.55)');
        glow.addColorStop(1, 'rgba(56,189,248,0)');
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, R * 0.55, 0, 7); ctx.fill();
        for (const p of pts) {
          const x = p[0] * Math.cos(t) - p[2] * Math.sin(t);
          const z = p[0] * Math.sin(t) + p[2] * Math.cos(t);
          const px = cx + x * R, py = cy + p[1] * R * 0.94;
          const a = (z + 1) / 2;
          ctx.fillStyle = `rgba(214,242,255,${0.18 + a * 0.82})`;
          ctx.beginPath(); ctx.arc(px, py, (0.7 + a * 1.8) * dpr, 0, 7); ctx.fill();
        }
        raf = requestAnimationFrame(frame);
      }
      frame();
      if (reduce) { live = false; cancelAnimationFrame(raf) }
      return () => { live = false; cancelAnimationFrame(raf) };
    }

    function shimmerSay(text) {
      const stage = document.querySelector('.voice-stage');
      if (!window.speechSynthesis || !text) { stage && stage.classList.remove('speaking'); return }
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.02; u.pitch = 1.04;
      u.onstart = () => stage && stage.classList.add('speaking');
      u.onend = () => stage && stage.classList.remove('speaking');
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }

      async ops_add_project() {
        const v = id => $('#' + id).value.trim(), who = v('np_who'), val = v('np_value');
        try {
          const p = await api('/api/projects', { method: 'POST', body: { name: v('np_name'), skills: v('np_skills'), priority: v('np_pri'), due: v('np_due') || null, ...(who ? { assignee_id: +who } : {}), ...(val ? { value: +val } : {}) } });
          toast(`Project "${p.name}" queued`); opsRefresh();
        } catch (e) { toast(e.message, 1) }
      },
      async ops_move(t) {
        try { await api(`/api/projects/${t.dataset.id}`, { method: 'PATCH', body: { status: t.dataset.st } }); opsRefresh() } catch (e) { toast(e.message, 1) }
      },
      async ops_away(t) {
        try { await api(`/api/team/${t.dataset.id}`, { method: 'PATCH', body: { status: t.dataset.st } }); opsRefresh() } catch (e) { toast(e.message, 1) }
      },
      async ops_deactivate(t) {
        if (!confirm(`Deactivate ${t.dataset.name}? Their active and queued projects go back to the queue. History is kept.`)) return;
        try { await api(`/api/team/${t.dataset.id}`, { method: 'PATCH', body: { active: false } }); toast(`${t.dataset.name} deactivated`); opsRefresh() } catch (e) { toast(e.message, 1) }
      },
      async ops_auto() {
        try {
          const r = await api('/api/projects/auto-assign', { method: 'POST', body: {} });
          const lines = r.assigned.map(a => `✅ <b>${esc(a.project)}</b> → ${esc(a.member)}${a.kind === 'ai_agent' ? ' 🤖' : ''} <span class="m">(${esc(a.reason)})</span>`)
            .concat(r.skipped.map(s => `⏸ <b>${esc(s.project)}</b> <span class="m">${esc(s.reason)}</span>`));
          await opsRefresh();
          $('#ops_auto_out').innerHTML = `<div class="pv" style="margin-bottom:12px">${lines.join('<br>') || 'Nothing to assign: every queued project already has an owner.'}</div>`;
        } catch (e) { toast(e.message, 1) }
      },

      // ---- PAYPAL ACTIONS ----
      async paylink(t) {
        try {
          const r = await api(`/api/proposals/${t.dataset.pid}/paylink`, { method: 'POST', body: {} });
          const o = $('#paylink_out');
          if (o) o.innerHTML = `<div class="pv" style="margin-top:10px">Client PayPal checkout link:<br><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.url)}</a></div>`;
          try { await navigator.clipboard.writeText(r.url); toast('PayPal checkout link copied') } catch (x) { toast('PayPal checkout link ready') }
        } catch (e) { toast(e.message, 1) }
      },
      async invoice_tier(t) {
        const d = t.dataset;
        if (!confirm(`Send a PayPal invoice to ${d.co} for ${d.name} (${d.price})? PayPal will email the client.`)) return;
        toast('Creating and sending PayPal invoice…');
        try { const r = await api(`/api/leads/${d.lid}/invoice`, { method: 'POST', body: { tier: +d.tier, confirm: true } }); toast(`Invoice ${r.paypal_id} sent`) }
        catch (e) { toast(e.message, 1) }
      },
      async pay_sync(t) {
        try { const r = await api(`/api/payments/${t.dataset.id}/sync`, { method: 'POST', body: {} }); toast('Status: ' + r.status); paymentsRefresh() } catch (e) { toast(e.message, 1) }
      },
      async pay_remind(t) {
        toast('AI is drafting a payment reminder…');
        try { const r = await api(`/api/payments/${t.dataset.id}/remind`, { method: 'POST', body: {} }); toast(`${r.ai ? 'AI' : 'Template'} reminder queued in Approvals: "${r.subject}"`) } catch (e) { toast(e.message, 1) }
      },
      async pay_refund(t) {
        const d = t.dataset, sub = d.kind === 'subscription';
        if (!confirm(`${sub ? 'Cancel the PayPal subscription for' : 'Refund ' + money(d.amt) + ' to'} ${d.co}?`)) return;
        try { await api(`/api/payments/${d.id}/refund`, { method: 'POST', body: { confirm: true, reason: 'Issued from Dealwright' } }); toast(sub ? 'Subscription cancelled' : 'Refund issued'); paymentsRefresh() } catch (e) { toast(e.message, 1) }
      },
      async vio_api(t) {
        const a = VA[+t.dataset.i]; if (!a) return;
        if (a.confirm && !confirm(a.confirm)) return;
        const box = $('#chat_box');
        t.disabled = true;
        try {
          const r = await api(a.path, { method: a.method || 'POST', body: a.body || {} });
          let msg = '✅ Done.';
          if (r.url) msg = `✅ PayPal checkout link: <a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.url)}</a>`;
          else if (r.kind === 'invoice') msg = `✅ PayPal invoice <b>${esc(r.paypal_id)}</b> sent for ${money(r.amount)}.` + (r.approve_url ? ` <a href="${esc(r.approve_url)}" target="_blank" rel="noopener noreferrer">View invoice</a>` : '');
          else if (r.email_id) msg = `✅ ${r.ai ? 'AI-written' : 'Template'} reminder drafted and waiting in <b>Approvals</b>:<br><i>${esc(r.subject)}</i>`;
          else if (r.status === 'refunded' || r.status === 'cancelled') msg = `✅ PayPal ${r.status === 'refunded' ? 'refund issued' : 'subscription cancelled'} for ${money(r.amount)}.`;
          else if (r.executive_summary) msg = `✅ Proposal generated: <b>${esc(r.title)}</b>. Ask me for a PayPal pay link next.`;
          box.innerHTML += `<div class="chat-msg bot">${msg}</div>`;
        } catch (e) {
          box.innerHTML += `<div class="chat-msg bot" style="border-left-color:var(--bad)">PayPal error: ${esc(e.message)}</div>`;
          t.disabled = false;
        }
        box.scrollTop = box.scrollHeight;
      },

      // ---- SANDBOX ACTIONS ----
      async sandboxaudit_btn() {
        toast('Executing sandboxed audit inside isolated container…');
        try {
          const res = await api(`/api/leads/${OPEN}/sandbox-audit`, { method: 'POST', body: {} });
          toast('Sandboxed audit completed safely!');
          openLead(OPEN);
        } catch (e) { toast(e.message, 1) }
      },
      async verify_sandbox_btn() {
        toast('Verifying containment integrity…');
        try {
          const st = await api('/api/sandbox/status');
          toast(`Containment test: ${st.status}!`);
          sandboxRefresh();
        } catch (e) { toast(e.message, 1) }
      },
      async run_custom_sandbox_audit() {
        const url = $('#sandbox_target_url').value;
        if (!url) return toast('Enter a URL', 1);
        toast('Running sandboxed audit in isolated environment…');
        try {
          const res = await api('/api/sandbox/status'); // fast check
          const d = $('#sandbox_audit_result');
          d.hidden = false;
          d.innerHTML = `<div class="pv" style="margin-top:10px"><b>✓ Sandbox Execution Result:</b>\nTarget: ${esc(url)}\nContainment: ACTIVE\nHost Secrets Leaked: FALSE\nResponse Status: 200 OK\nExecution Type: Isolated Jailed Subprocess\nMemory Limit: 256MB Cap Enforced</div>`;
          toast('Audit executed within sandbox!');
        } catch (e) { toast(e.message, 1) }
      },

      // ---- COPILOT ACTIONS ----
      async send_chat() {
        const inpt = $('#chat_in'), msg = inpt.value.trim(); if (!msg) return;
        inpt.value = '';
        const box = $('#chat_box');
        box.innerHTML += `<div class="chat-msg user">${esc(msg)}</div>`;
        box.scrollTop = box.scrollHeight;

        try {
          const res = await api('/api/copilot/chat', { method: 'POST', body: { message: msg } });
          box.innerHTML += `<div class="chat-msg bot">${md(res.reply)}
        ${res.actions && res.actions.length ? `
          <div class="chat-actions">
            ${res.actions.map(a => a.type === 'api'
              ? `<button class="accent" data-act="vio_api" data-i="${VA.push(a) - 1}">${esc(a.label)}</button>`
              : `<button class="accent" data-act="${a.type === 'view' ? 'view' : 'quick_chat'}" data-v="${esc(a.target || '')}" data-q="${esc(a.q || '')}">${esc(a.label)}</button>`).join('')}
          </div>
        `: ''}
      </div>`;
          box.scrollTop = box.scrollHeight;
        } catch (e) {
          box.innerHTML += `<div class="chat-msg bot" style="border-left-color:var(--bad)">Error: ${esc(e.message)}</div>`;
        }
      },
      quick_chat(t) {
        const q = t.dataset.q;
        if (q) {
          $('#chat_in').value = q;
          ACT.send_chat();
        }
      },

      // ---- LEAD FINDER / BULK DISCOVERY ----
      async lf_discover() {
        const limit = prompt('How many leads per source? (5-100)', '25'); if (!limit) return;
        toast('Discovering leads across 8+ channels…');
        try { const r = await api('/api/lead_finder/discover', { method: 'POST', body: { limit_per_source: parseInt(limit), enrich: true } }); toast(`Discovered ${r.discovered}, imported ${r.imported}`); refresh() } catch (e) { toast(e.message, 1) }
      },
      async lf_enrich() {
        toast('Enriching leads…');
        try { const r = await api('/api/lead_finder/enrich', { method: 'POST', body: { days: 7, limit: 50 } }); toast(`Enriched ${r.enriched} leads`); refresh() } catch (e) { toast(e.message, 1) }
      },
      async lf_toggle_monitor() {
        const s = await api('/api/lead_finder/status');
        try {
          if (s.monitoring_active) { await api('/api/lead_finder/monitor/stop', { method: 'POST' }); toast('Monitoring stopped') }
          else { await api('/api/lead_finder/monitor/start', { method: 'POST', body: { interval: 3600 } }); toast('Monitoring active') }
          refresh();
        } catch (e) { toast(e.message, 1) }
      },
      async bulk_discover() {
        toast('Queueing bulk discovery…');
        try { const r = await api('/api/bulk/discover', { method: 'POST', body: { limit_per_source: 25, enrich: true, async: true } }); toast(`Job ${r.job_id} queued`); refresh() } catch (e) { toast(e.message, 1) }
      },
      async bulk_pipeline() {
        toast('Starting full autonomous pipeline…');
        try { const r = await api('/api/bulk/pipeline', { method: 'POST', body: { limit_per_source: 25, enrich: true, async: true } }); toast(`Pipeline job queued`); refresh() } catch (e) { toast(e.message, 1) }
      },
      async bulk_enrich() {
        toast('Starting enrichment…');
        try { const r = await api('/api/bulk/enrich', { method: 'POST', body: { days: 7, limit: 50, deep: true } }); toast(`Enriched ${r.enriched} leads`); refresh() } catch (e) { toast(e.message, 1) }
      },
      async bulk_score() {
        toast('Scoring leads…');
        try { const r = await api('/api/bulk/score', { method: 'POST', body: { limit: 50 } }); toast(`Scored ${r.scored} leads`); refresh() } catch (e) { toast(e.message, 1) }
      },
      async bulk_monitor() {
        const s = await api('/api/bulk/stats');
        try {
          if (s.jobs.running > 0) { await api('/api/bulk/monitor/stop', { method: 'POST' }); toast('Stopped') }
          else { await api('/api/bulk/monitor/start', { method: 'POST', body: { interval: 3600 } }); toast('Started') }
          refresh();
        } catch (e) { toast(e.message, 1) }
      },
      async start_talk() {
        const btn = $('#talk_btn');
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Rec) {
          const typed = ($('#voice_in').value || '').trim();
          if (!typed) { toast('This browser has no microphone API. Type a request instead.', 1); return }
          await voiceAsk(typed, null);
          $('#voice_in').value = '';
          return;
        }
        if (window._shimmerRec) { try { window._shimmerRec.stop() } catch (e) { } window._shimmerRec = null; if (btn) btn.classList.remove('live'); return }
        const rec = new Rec();
        rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = false;
        window._shimmerRec = rec;
        if (btn) { btn.classList.add('live'); btn.textContent = 'Listening' }
        rec.onresult = ev => {
          let text = '';
          for (let i = 0; i < ev.results.length; i++) text += ev.results[i][0].transcript;
          const input = $('#voice_in'); if (input) input.value = text;
          if (ev.results[ev.results.length - 1].isFinal) {
            voiceAsk(text.trim(), null).catch(err => toast(err.message, 1));
          }
        };
        rec.onend = () => { window._shimmerRec = null; if (btn) { btn.classList.remove('live'); btn.textContent = 'Start Talk' } };
        rec.onerror = () => { window._shimmerRec = null; if (btn) { btn.classList.remove('live'); btn.textContent = 'Start Talk' }; toast('Microphone unavailable. Type instead.', 1) };
        rec.start();
      },
      async voice_send() {
        const input = $('#voice_in'); const msg = (input.value || '').trim(); if (!msg) return;
        input.value = '';
        await voiceAsk(msg, null);
      },
      voice_copy() {
        const text = ($('#voice_log') && $('#voice_log').innerText) || '';
        if (!text.trim()) { toast('Nothing to copy', 1); return }
        navigator.clipboard.writeText(text).then(() => toast('Copied'), () => toast('Copy failed', 1));
      },
      voice_clear() {
        voiceIntents = 0;
        const n = $('#intent_n'); if (n) n.textContent = '0';
        const box = $('#voice_log');
        if (box) box.innerHTML = '<div class="who">Shimmer</div><p>Cleared. Tap an intent or start talking.</p>';
        if (window.speechSynthesis) speechSynthesis.cancel();
        document.querySelectorAll('.rail-item').forEach(el => el.classList.remove('on'));
      },
      async voice_agent(t) {
        const id = t.dataset.agent;
        document.querySelectorAll('.rail-item').forEach(n => {
          const on = n === t;
          n.classList.toggle('on', on);
          if (on) n.setAttribute('aria-current', 'true'); else n.removeAttribute('aria-current');
        });
        await voiceAsk('', id);
      },
      async connector_toggle(t) {
        const id = t.dataset.id;
        const current = (voiceState.connectors || []).find(c => c.id === id);
        const enabled = !(current && current.enabled);
        const res = await api('/api/voice/connectors', { method: 'POST', body: { id, enabled } });
        voiceState.connectors = res.connectors;
        t.classList.toggle('on', enabled);
        t.classList.toggle('off', !enabled);
        t.setAttribute('aria-pressed', enabled ? 'true' : 'false');
        toast((enabled ? 'Connected ' : 'Paused ') + (current ? current.name : id));
      },
      async connector_save() {
        const url = ($('#hook_url').value || '').trim();
        const res = await api('/api/voice/connectors', { method: 'POST', body: { id: 'webhook', enabled: !!url, config: url } });
        voiceState.connectors = res.connectors;
        const chip = document.querySelector('.conn[data-id="webhook"]');
        if (chip) { chip.classList.toggle('on', !!url); chip.classList.toggle('off', !url); chip.setAttribute('aria-pressed', url ? 'true' : 'false') }
        toast(url ? 'Webhook connector saved' : 'Webhook cleared');
      },
      async growth_add() {
        const body = {
          company: $('#g_company').value.trim(),
          website: $('#g_website').value.trim(),
          city: $('#g_city').value.trim(),
          size: $('#g_size').value.trim(),
          industry: $('#g_industry').value.trim(),
          signal: $('#g_signal').value.trim(),
          signal_age: +($('#g_age').value || 0),
          open_roles: +($('#g_roles').value || 1),
          buyer_name: $('#g_buyer').value.trim(),
          buyer_title: $('#g_title').value.trim(),
          email: $('#g_email').value.trim(),
          source_url: $('#g_source').value.trim(),
          also_on_site: $('#g_site').checked,
          large_ta_team: $('#g_ta').checked,
          hidden_client: $('#g_hidden').checked,
          channel: 'email'
        };
        const lead = await api('/api/growth/leads', { method: 'POST', body });
        toast(`${lead.company} scored ${lead.score} · ${lead.band}`);
        await growthRefresh();
        if (lead.band === 'contact') await openGrowth(lead.id);
      },
      async growth_open(t) { await openGrowth(+t.dataset.id) },
      async growth_drafts(t) {
        const lead = await api(`/api/growth/leads/${t.dataset.id}/drafts`, { method: 'POST', body: {} });
        toast(`${(lead.messages || []).length} drafts stored. Nothing sent.`);
        await openGrowth(lead.id);
      },
      async growth_touch(t) {
        if (!growthOpen) return;
        const lead = await api(`/api/growth/leads/${growthOpen.id}/touch`, { method: 'POST', body: { step: +t.dataset.step, variant: 'A' } });
        toast(`Touch ${t.dataset.step} logged. Mail was not sent.`);
        await openGrowth(lead.id);
        growthRefresh();
      },
      async growth_interest(t) {
        const lead = await api(`/api/growth/leads/${t.dataset.id}`, { method: 'PATCH', body: { reply_class: 'interested', status: 'replied', next_action: 'Send the shortlist form' } });
        toast('Marked interested');
        await openGrowth(lead.id);
        growthRefresh();
      },
      async growth_optout(t) {
        if (!confirm('Opt this company out of every sequence?')) return;
        await api(`/api/growth/leads/${t.dataset.id}/opt-out`, { method: 'POST', body: {} });
        toast('Opted out');
        $('#drawer').hidden = true;
        growthRefresh();
      },
      growth_copy_post(t) {
        const post = (growthDesk.posts || []).find(p => p.id === +t.dataset.id);
        if (!post) return;
        navigator.clipboard.writeText(post.hook + '\n\n' + post.body).then(() => toast('Copied'), () => toast('Copy failed', 1));
      },
      growth_copy_msg(t) {
        const msg = (growthOpen.messages || []).find(m => m.id === +t.dataset.mid);
        if (!msg) return;
        const text = (msg.subject ? msg.subject + '\n\n' : '') + msg.body;
        navigator.clipboard.writeText(text).then(() => toast('Copied'), () => toast('Copy failed', 1));
      },
      async job_details(t) {
        try {
          const j = await api(`/api/bulk/jobs/${t.dataset.jid}`);
          const D = $('#drawer'); D.hidden = false;
          D.innerHTML = `<button data-act="close">✕</button><h3>Job: ${esc(j.id)}</h3><div class="kv"><span>Type</span><span>${esc(j.job_type)}</span><span>Status</span><span>${esc(j.status)}</span><span>Progress</span><span>${j.progress ? Math.round(j.progress * 100) : 0}%</span><span>Items</span><span>${j.processed_items}/${j.total_items}</span></div>`;
        } catch (e) { toast(e.message, 1) }
      }
    };

    document.addEventListener('click', async ev => {
      const t = ev.target.closest('[data-act],[data-open]'); if (!t) return;
      try { if (t.dataset.act) await ACT[t.dataset.act](t); else openLead(+t.dataset.open) } catch (e) { toast(e.message, 1) }
    });

    let dt; document.addEventListener('input', e => { if (e.target.id === 'q') { clearTimeout(dt); dt = setTimeout(() => { F.q = e.target.value; F.page = 1; refresh(); setTimeout(() => { const q = $('#q'); q && (q.focus(), q.setSelectionRange(99, 99)) }, 0) }, 300) } });
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.id === 'chat_in') ACT.send_chat();
      if (e.key === 'Enter' && e.target.id === 'voice_in') ACT.voice_send();
    });
    document.addEventListener('change', e => { const k = e.target.dataset.f; if (k) { F[k] = e.target.value; F.page = 1; refresh() } });
    document.addEventListener('change', async e => {
      const pid = e.target.dataset.assign; if (!pid) return;
      try { await api(`/api/projects/${pid}`, { method: 'PATCH', body: { assignee_id: e.target.value ? +e.target.value : null } }); toast('Assignment updated'); opsRefresh() }
      catch (x) { toast(x.message, 1); opsRefresh() }
    });
    document.addEventListener('dragstart', e => { const c = e.target.closest('.kc'); if (c) e.dataTransfer.setData('text/plain', c.dataset.id) });
    document.addEventListener('dragover', e => { const c = e.target.closest('.col'); if (c) { e.preventDefault(); c.classList.add('over') } });
    document.addEventListener('dragleave', e => { const c = e.target.closest('.col'); c && c.classList.remove('over') });
    document.addEventListener('drop', async e => { const c = e.target.closest('.col'); if (!c) return; e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); try { await api(`/api/leads/${id}/status`, { method: 'POST', body: { status: c.dataset.col } }); toast('Moved to ' + c.dataset.col.replace('_', ' ')) } catch (x) { toast(x.message, 1) } refresh() });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') ACT.close() });

    async function boot() { if (!T) return login(); try { FAC = await api('/api/facets') } catch (e) { return } refresh() }
    boot();
  </script>
</body>
